# Build and test (PLAN D22). Manual only: it runs on GitHub's machines when started from the
# Actions tab. Standard GitHub-hosted runners are free for a public repository and use no
# Actions minutes. No deploy, no secrets, no external link checks.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned (B91): GitHub moves ubuntu-latest to 26.04 between 19 October and 19 November 2026,
    # so two runs could land on different images. Moving to ubuntu-26.04 is a deliberate one-line
    # change; Playwright 1.64.1 supports both.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # No step needs git credentials, so the job's GitHub token isn't left on disk while npm ci
      # runs install scripts (B91).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build (with check-links, check-dashes, budgets and the service worker)
        run: npm run build
      - name: Build with the 93-row sample, the browser tests' fixture
        run: npm run build:sample
      - name: Browsers for Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end, Chromium
        run: npx playwright test --project=chromium
      - name: End-to-end, WebKit
        run: npx playwright test --project=webkit
      - name: End-to-end, service worker
        run: npx playwright test --project=pwa
      - name: Phone smoke set (iPhone 13, Pixel 7)
        run: npx playwright test --project=iphone --project=pixel
      - name: Build without Check and smoke-test it (Q9)
        run: npm run test:no-check
      # Sends the dependency list to the npm registry to look up advisories. Its result depends on
      # the registry's list on the day, not on the code, so it runs after the tests, and also when
      # one failed (B90): a new advisory can't skip the test evidence. Any advisory fails the job.
      - name: Dependency audit (shipped dependencies)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev
      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
