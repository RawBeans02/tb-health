<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F1F3F4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TB PH">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<script src="pwa.js" defer></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Install the app — TB PH</title>
  <meta name="description" content="Add TB PH to your home screen. It opens full screen, and the planner, symptom check and Learn still open without a signal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Newsreader:opsz,wght@6..72,600&display=swap">
  <style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;background:#F1F3F4;color:#14212B;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:18px;line-height:1.5}a{color:#175458;text-decoration-thickness:1.5px;text-underline-offset:3px}a:hover{color:#14212B}:focus-visible{outline:3px solid #14212B;outline-offset:3px}h1,h2,h3,p,ul,ol{margin:0}button{font:inherit;color:inherit}</style>
</helmet>
<div lang="{{ lang }}" style="min-height:100vh; display:flex; flex-direction:column; background:#F1F3F4;">
  <div style="position:sticky; top:0; z-index:40;">
    <dc-import name="SiteHeader" lang="{{ lang }}" current="" on-lang="{{ setLang }}" hint-size="100%,65px"></dc-import>
  </div>
  <main id="main" tabindex="-1" style="flex:1; outline:none;">
    <div style="max-width:1120px; margin:0 auto; padding:clamp(40px,7vw,88px) clamp(16px,4vw,64px) clamp(48px,7vw,80px);">
      <div style="max-width:760px; display:grid; gap:28px;">
        <div style="display:grid; gap:12px;">
          <h1 style="font-weight:700; font-size:clamp(2.125rem,1.7rem + 1.8vw,2.875rem); line-height:1.06; letter-spacing:-0.02em; color:#C42032; text-wrap:balance;">{{ t.h1 }}</h1>
          <p style="font-size:19px; line-height:1.5; color:#3F4B53; max-width:34em; text-wrap:pretty;">{{ t.lead }}</p>
        </div>

        <sc-if value="{{ standalone }}" hint-placeholder-val="{{ false }}">
          <div role="status" style="border-radius:18px; background:#FFFFFF; padding:16px 18px; display:flex; gap:12px; align-items:center; font-weight:700;">
            <span aria-hidden="true" style="color:#1E6B70; font-size:20px;">✓</span><span>{{ t.installed }}</span>
          </div>
        </sc-if>

        <sc-if value="{{ can }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid; gap:10px; max-width:560px;">
            <button type="button" onClick="{{ install }}" style="width:100%; min-height:58px; padding:0 24px; border:0; border-radius:999px; background:#1E6B70; color:#FFFFFF; font-size:20px; font-weight:700; cursor:pointer;" style-hover="background:#175458;">{{ t.button }}</button>
          </div>
        </sc-if>
        <p role="status" style="font-size:17px; font-weight:700; min-height:0;">{{ statusText }}</p>

        <sc-for list="{{ sections }}" as="s" hint-placeholder-count="2">
          <section aria-labelledby="{{ s.id }}" style="display:grid; gap:12px;">
            <h2 id="{{ s.id }}" style="font-size:clamp(1.375rem,1.25rem + 0.6vw,1.75rem); font-weight:700; line-height:1.25; letter-spacing:-0.01em;">{{ s.title }}</h2>
            <ol style="list-style:none; padding:0; border-radius:18px; background:#FFFFFF; overflow:hidden;">
              <sc-for list="{{ s.steps }}" as="st" hint-placeholder-count="3">
                <li style="display:grid; grid-template-columns:56px 1fr; align-items:center; min-height:60px;">
                  <span aria-hidden="true" style="justify-self:center; width:30px; height:30px; border-radius:50%; background:#1E6B70; color:#FFFFFF; display:grid; place-items:center; font-size:15px; font-weight:700;">{{ st.n }}</span>
                  <span style="padding:14px 16px 14px 0; border-top:{{ st.sep }}; font-size:18px; line-height:1.45;"><span style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">{{ st.n }}. </span>{{ st.text }}</span>
                </li>
              </sc-for>
            </ol>
          </section>
        </sc-for>

        <section aria-labelledby="offline-h" style="display:grid; gap:12px;">
          <h2 id="offline-h" style="font-size:clamp(1.375rem,1.25rem + 0.6vw,1.75rem); font-weight:700; line-height:1.25; letter-spacing:-0.01em;">{{ t.offH }}</h2>
          <ul style="list-style:none; padding:0; border-radius:18px; background:#FFFFFF; overflow:hidden;">
            <sc-for list="{{ offline }}" as="o" hint-placeholder-count="3">
              <li style="display:grid; grid-template-columns:56px 1fr; align-items:center; min-height:56px;">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" style="justify-self:center; color:#1E6B70;"><path d="{{ o.icon }}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                <span style="padding:14px 16px 14px 0; border-top:{{ o.sep }}; font-size:18px; line-height:1.45;">{{ o.text }}</span>
              </li>
            </sc-for>
          </ul>
          <p style="font-size:16px; line-height:1.45; color:#3F4B53;">{{ t.offNote }}</p>
        </section>

        <p style="font-size:16px; line-height:1.45; color:#56626A; max-width:40em;">{{ t.privacy }}</p>
      </div>
    </div>
  </main>
  <dc-import name="SiteFooter" lang="{{ lang }}" current="install" on-lang="{{ setLang }}" hint-size="100%,340px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    lang: (() => { try { return localStorage.getItem('tbph-lang') === 'fil' ? 'fil' : 'en'; } catch (e) { return 'en'; } })(),
    can: false, standalone: false, platform: 'android', status: ''
  };
  componentDidMount() {
    document.documentElement.lang = this.state.lang;
    this.sync = () => { const P = window.TBPH_PWA; if (!P) return; this.setState({ can: P.canInstall(), standalone: P.isStandalone(), platform: P.platform() }); };
    this.onInstalled = () => this.setState({ can: false, status: 'done' });
    window.addEventListener('tbph:installable', this.sync);
    window.addEventListener('tbph:installed', this.onInstalled);
    this.sync(); this.timer = setTimeout(this.sync, 900);
  }
  componentWillUnmount() {
    window.removeEventListener('tbph:installable', this.sync);
    window.removeEventListener('tbph:installed', this.onInstalled);
    clearTimeout(this.timer);
  }
  setLang = (l) => { try { localStorage.setItem('tbph-lang', l); } catch (e) {} document.documentElement.lang = l; this.setState({ lang: l }); };
  install = () => {
    const P = window.TBPH_PWA; if (!P) return;
    P.promptInstall().then((o) => this.setState({ can: P.canInstall(), status: o === 'accepted' ? 'done' : (o === 'dismissed' ? 'later' : '') }));
  };
  renderVals() {
    const en = this.state.lang === 'en';
    const T = en ? {
      h1: 'Use TB PH like an app.',
      lead: 'Add it to your home screen. It opens full screen, and once it has been opened, the planner, the symptom check and Learn still work without a signal.',
      button: 'Install TB PH',
      installed: "TB PH is installed. You're using the app.",
      done: 'Installed. Look for TB PH on your home screen.',
      later: 'No problem. You can install it any time from this page.',
      android: 'On Android (Chrome)', ios: 'On iPhone or iPad (Safari)', desktop: 'On a computer (Chrome or Edge)',
      aSteps: ['Tap Install TB PH on this page. If you don\u2019t see it, open the browser menu (⋮) and tap Install app or Add to Home screen.', 'Confirm.', 'Open TB PH from your home screen.'],
      iSteps: ['Open this page in Safari, then tap the Share button (a square with an arrow pointing up).', 'Scroll down and tap Add to Home Screen.', 'Tap Add. TB PH appears on your home screen.'],
      dSteps: ['Click the install icon at the right end of the address bar, or open the browser menu and choose Install TB PH.', 'Confirm.', 'Open TB PH from your apps or desktop.'],
      offH: 'What works without a signal',
      off: ['The route planner, using the saved list of centers', 'The symptom check', 'Learn about TB and the data'],
      offNote: 'Directions, maps and calls still need a connection. Open TB PH once with a signal so it can save itself on your phone.',
      privacy: "Installing doesn't create an account and doesn't share anything about you. It only saves TB PH's pages and data on your phone."
    } : {
      h1: 'Gamitin ang TB PH na parang app.',
      lead: 'Idagdag ito sa home screen mo. Bumubukas ito nang full screen, at kapag nabuksan na minsan, gumagana pa rin ang planner, ang symptom check at ang Alamin kahit walang signal.',
      button: 'I-install ang TB PH',
      installed: 'Naka-install na ang TB PH. Ginagamit mo na ang app.',
      done: 'Na-install na. Hanapin ang TB PH sa home screen mo.',
      later: 'Walang problema. Puwede mo itong i-install anumang oras mula sa pahinang ito.',
      android: 'Sa Android (Chrome)', ios: 'Sa iPhone o iPad (Safari)', desktop: 'Sa computer (Chrome o Edge)',
      aSteps: ['I-tap ang I-install ang TB PH sa pahinang ito. Kung wala ito, buksan ang menu ng browser (⋮) at i-tap ang Install app o Add to Home screen.', 'Kumpirmahin.', 'Buksan ang TB PH mula sa home screen mo.'],
      iSteps: ['Buksan ang pahinang ito sa Safari, saka i-tap ang Share button (parisukat na may arrow na nakaturo pataas).', 'Mag-scroll pababa at i-tap ang Add to Home Screen.', 'I-tap ang Add. Lalabas ang TB PH sa home screen mo.'],
      dSteps: ['I-click ang install icon sa dulong kanan ng address bar, o buksan ang menu ng browser at piliin ang Install TB PH.', 'Kumpirmahin.', 'Buksan ang TB PH mula sa iyong apps o desktop.'],
      offH: 'Ano ang gumagana kahit walang signal',
      off: ['Ang route planner, gamit ang naka-save na listahan ng mga center', 'Ang symptom check', 'Ang Alamin ang TB at ang datos'],
      offNote: 'Kailangan pa rin ng koneksiyon para sa direksiyon, mapa at tawag. Buksan muna ang TB PH nang may signal para ma-save nito ang sarili sa phone mo.',
      privacy: 'Walang account na gagawin at walang ibinabahaging impormasyon tungkol sa iyo ang pag-install. Sine-save lang nito ang mga pahina at datos ng TB PH sa phone mo.'
    };
    // same paths as the phone tab bar: Find TB care (pin), Check symptoms (clipboard), Learn (book)
    const ICONS = ['M12 21s-6.5-5.6-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21zM12 12.6a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2z',
      'M9 3h6v3H9zM8.5 4.5h-2A1.5 1.5 0 0 0 5 6v13.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5h-2M9 13.5l2 2 4-4.5',
      'M3 5.5c2.5-1 5.5-1 9 1 3.5-2 6.5-2 9-1V19c-2.5-1-5.5-1-9 1-3.5-2-6.5-2-9-1zM12 6.5V20'];
    const mk = (id, title, steps) => ({ id, title, steps: steps.map((text, i) => ({ n: i + 1, text, sep: i ? '1px solid #E3E6E8' : '0' })) });
    const A = mk('android-h', T.android, T.aSteps), I = mk('ios-h', T.ios, T.iSteps), D = mk('desktop-h', T.desktop, T.dSteps);
    const p = this.state.platform;
    const sections = p === 'ios' ? [I, A] : p === 'desktop' ? [D, A, I] : [A, I];
    return {
      lang: this.state.lang, setLang: this.setLang, t: T, install: this.install,
      can: this.state.can && !this.state.standalone, standalone: this.state.standalone,
      statusText: this.state.status === 'done' ? T.done : this.state.status === 'later' ? T.later : '',
      sections: this.state.standalone ? [] : sections,
      offline: T.off.map((text, i) => ({ text, icon: ICONS[i], sep: i ? '1px solid #E3E6E8' : '0' }))
    };
  }
}
</script>
</body>
</html>
